[package]
name = "kernel-core"
version.workspace = true
edition.workspace = true

[dependencies]
spin = "0.9.8"
heapless = "0.8"
# Phase 69c Track A — TTF/OTF parser. `no-std-float` selects
# `ttf-parser`'s no-std float backend (via the `core_maths` crate)
# so the crate builds under m3OS's `x86_64-unknown-none` target
# (no `std`, no SIMD math). `core_maths` itself still pulls `libm`
# transitively — the feature does *not* remove `libm` from the
# build graph; it gives `ttf-parser` a `no_std` math surface that
# routes through `core_maths`. Pinned to a minor version so a
# breaking 0.x release does not silently change parser behaviour.
ttf-parser = { version = "0.25", default-features = false, features = ["no-std-float"] }

[dev-dependencies]
proptest = "1"
loom = "0.7"

[features]
default = ["std"]
std = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

# When used from the kernel (no_std), disable the default "std" feature:
# kernel-core = { path = "../kernel-core", default-features = false }
