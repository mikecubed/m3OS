[package]
name = "stdin_feeder"
version.workspace = true
edition.workspace = true

[[bin]]
name = "stdin_feeder"
path = "src/main.rs"

[dependencies]
syscall-lib = { path = "../syscall-lib", features = ["alloc"] }
# Phase 100 D.1 — link the host-tested KeyEvent→stdin mapping directly rather
# than carrying a hand-synced copy. `default-features = false` keeps kernel-core
# in its no_std configuration (same as the usb-hid class driver).
kernel-core = { path = "../../kernel-core", default-features = false }
