[package]
name = "crypto-lib"
version.workspace = true
edition.workspace = true

# Allow the `aes_force_soft` rustc cfg used by the host-side A/B bench
# (passed as RUSTFLAGS='--cfg aes_force_soft' to force the fixsliced software
# AES backend for the soft-path throughput measurement).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(aes_force_soft)'] }

[features]
default = []
# Phase 110 Track C — the argon2id re-export needs syscall-lib's argon2 module
# (which pulls the `alloc` crate; `argon2` implies syscall-lib's `alloc`).
alloc = ["syscall-lib/argon2"]

[dependencies]
sha2 = { workspace = true }
hmac = { workspace = true }
hkdf = { workspace = true }
chacha20poly1305 = { workspace = true }
aes = { workspace = true }
ctr = { workspace = true }
ed25519-dalek = { workspace = true }
x25519-dalek = { workspace = true }
rand_chacha = { workspace = true }
rand_core = { workspace = true }
syscall-lib = { path = "../syscall-lib" }
