[package]
name = "shadow"
version = "0.1.0"
edition = "2024"
description = "Phase 66 Track B — atomic shadow-file writes (temp + fsync + rename) shared by passwd and adduser."

[features]
default = ["guest-bin"]
# The default build is no_std and links against syscall-lib for the
# concrete production filesystem backend.
guest-bin = []
# Enabled by `cargo test -p shadow --target x86_64-unknown-linux-gnu`.
# Drops the syscall_lib dependency wiring so the pure-logic core and the
# mock filesystem can run on the host.
host-tests = []

[lib]
name = "shadow"
path = "src/lib.rs"

[[test]]
name = "shadow_host"
path = "host-tests/shadow_host.rs"
required-features = ["host-tests"]

[dependencies]
syscall-lib = { path = "../../syscall-lib" }
