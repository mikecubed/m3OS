[package]
name = "imagefmt"
version.workspace = true
edition.workspace = true
description = "Phase 105 Track C — shared image codecs: BMP/PNG/JPEG decode, PNG encode, scale-to-fit blit."

[lib]
name = "imagefmt"
path = "src/lib.rs"

