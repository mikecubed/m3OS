[package]
name = "fb-takeover"
version = "0.1.0"
edition = "2024"

[features]
os-binary = []

[[bin]]
name = "fb-takeover"
path = "src/main.rs"
required-features = ["os-binary"]

[dependencies]
syscall-lib = { path = "../syscall-lib", features = ["alloc"] }
kernel-core = { path = "../../kernel-core", default-features = false }
m3ctl = { path = "../m3ctl" }
