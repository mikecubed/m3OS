[package]
name = "notifyd"
version.workspace = true
edition.workspace = true
description = "Phase 73 — notification daemon + notify-send utility"

[[bin]]
name = "notifyd"
path = "src/main.rs"

[[bin]]
name = "notify-send"
path = "src/bin/notify_send.rs"

[dependencies]
syscall-lib = { path = "../syscall-lib", features = ["alloc"] }
kernel-core = { path = "../../kernel-core", default-features = false }
desktop_client = { path = "../lib/desktop_client" }
