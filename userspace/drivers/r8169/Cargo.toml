[package]
name = "r8169_driver"
version = "0.79.0"
edition = "2024"
description = "Phase 79 Track C — ring-3 Realtek RTL8111/8168/8169 Gigabit NIC driver."

[lib]
# Distinct from the bin name so `use r8169_hal::{init, io, rings}` in the bin
# (and in the r8125 driver, which reuses this ring/bring-up HAL) is unambiguous;
# a same-name lib+bin can shadow lib paths in the bin crate.
name = "r8169_hal"
path = "src/lib.rs"

[features]
os-binary = []

[[bin]]
name = "r8169_driver"
path = "src/main.rs"
required-features = ["os-binary"]

[dependencies]
driver_runtime = { path = "../../lib/driver_runtime" }
syscall-lib = { path = "../../syscall-lib", features = ["alloc"] }
kernel-core = { path = "../../../kernel-core", default-features = false }
