[package]
name = "hda_driver"
version.workspace = true
edition.workspace = true
description = "Phase 80b — ring-3 Intel HDA audio hardware driver (out-of-process)."

# The library target exposes the driver-internal modules for host-side
# integration tests on x86_64-unknown-linux-gnu without the OS binary's
# _start symbol. (The authoritative host-tested logic lives in
# kernel-core::hda; this crate's modules are production register-poking.)
[lib]
name = "hda_driver"
path = "src/lib.rs"

# The binary defines _start via syscall_lib::entry_point!. Gate it on
# "os-binary" so `cargo test --target x86_64-unknown-linux-gnu` skips the
# [[bin]] target; xtask adds --features os-binary for the OS image.
[features]
os-binary = []

[[bin]]
name = "hda_driver"
path = "src/main.rs"
required-features = ["os-binary"]

[dependencies]
driver_runtime = { path = "../../lib/driver_runtime" }
syscall-lib = { path = "../../syscall-lib", features = ["alloc"] }
kernel-core = { path = "../../../kernel-core", default-features = false }
