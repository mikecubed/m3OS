[package]
name = "xhci_driver"
version.workspace = true
edition.workspace = true
description = "Phase 78a — ring-3 xHCI USB host-controller driver (host-controller bring-up)."

[[bin]]
name = "xhci_driver"
path = "src/main.rs"

[dependencies]
syscall-lib = { path = "../../syscall-lib", features = ["alloc"] }
driver_runtime = { path = "../../lib/driver_runtime" }
kernel-core = { path = "../../../kernel-core", default-features = false }
usb-core = { path = "../../lib/usb-core" }
