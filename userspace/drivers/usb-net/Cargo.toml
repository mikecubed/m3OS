[package]
name = "usb_net"
version.workspace = true
edition.workspace = true
description = "Phase 92e — ring-3 USB-Ethernet (CDC-ECM / CDC-NCM) class driver presenting a RemoteNic."

[[bin]]
name = "usb_net"
path = "src/main.rs"

[dependencies]
driver_runtime = { path = "../../lib/driver_runtime" }
syscall-lib = { path = "../../syscall-lib", features = ["alloc"] }
kernel-core = { path = "../../../kernel-core", default-features = false }
usb-core = { path = "../../lib/usb-core" }
