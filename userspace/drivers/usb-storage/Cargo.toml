[package]
name = "usb_storage"
version = "0.92.0"
edition = "2024"
description = "Phase 92 — ring-3 USB Mass Storage (Bulk-Only Transport) class driver."

[[bin]]
name = "usb_storage"
path = "src/main.rs"

[dependencies]
syscall-lib = { path = "../../syscall-lib", features = ["alloc"] }
kernel-core = { path = "../../../kernel-core", default-features = false }
usb-core = { path = "../../lib/usb-core" }
