[package]
name = "usb_hid"
version.workspace = true
edition.workspace = true
description = "Phase 78c — ring-3 USB HID Boot-Protocol class driver (keyboard + mouse)."

[[bin]]
name = "usb_hid"
path = "src/main.rs"

[dependencies]
syscall-lib = { path = "../../syscall-lib", features = ["alloc"] }
kernel-core = { path = "../../../kernel-core", default-features = false }
usb-core = { path = "../../lib/usb-core" }
