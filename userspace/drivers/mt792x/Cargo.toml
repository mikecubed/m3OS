[package]
name = "mt792x_driver"
version.workspace = true
edition.workspace = true
description = "Phase 81 Track DRV-shell — ring-3 MediaTek mt792x Wi-Fi driver hardware shell."

[lib]
name = "mt792x_hal"
path = "src/lib.rs"

[features]
os-binary = []

[[bin]]
name = "mt792x_driver"
path = "src/main.rs"
required-features = ["os-binary"]

[dependencies]
driver_runtime = { path = "../../lib/driver_runtime" }
syscall-lib = { path = "../../syscall-lib", features = ["alloc"] }
kernel-core = { path = "../../../kernel-core", default-features = false }
# Track DRV-net: the 802.11 mgmt plane + WPA2-PSK supplicant FSM the io loop drives.
wifi-core = { path = "../../wifi-core" }
