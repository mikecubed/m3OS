[package]
name = "usb_audio"
version.workspace = true
edition.workspace = true
description = "Phase 92c — ring-3 USB Audio Class (UAC) isochronous PCM-out driver."

[[bin]]
name = "usb_audio"
path = "src/main.rs"

[dependencies]
driver_runtime = { path = "../../lib/driver_runtime" }
syscall-lib = { path = "../../syscall-lib", features = ["alloc"] }
kernel-core = { path = "../../../kernel-core", default-features = false }
usb-core = { path = "../../lib/usb-core" }
