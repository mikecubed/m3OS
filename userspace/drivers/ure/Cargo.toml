[package]
name = "ure_driver"
version.workspace = true
edition.workspace = true
description = "Phase 96 Stage-1a — ring-3 USB-Ethernet driver for RTL815x (RTL8156 bring-up probe)."

[[bin]]
name = "ure_driver"
path = "src/main.rs"

[dependencies]
syscall-lib = { path = "../../syscall-lib", features = ["alloc"] }
kernel-core = { path = "../../../kernel-core", default-features = false }
usb-core = { path = "../../lib/usb-core" }
driver_runtime = { path = "../../lib/driver_runtime" }
