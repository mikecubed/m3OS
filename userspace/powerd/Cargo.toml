[package]
name = "powerd"
version.workspace = true
edition.workspace = true
description = "Phase 103 — ring-3 power policy daemon: battery/AC state over acpid's ACPI_EVAL, the `power` IPC service (m3ctl + settings panel), and acpid event subscription."

[[bin]]
name = "powerd"
path = "src/main.rs"

[dependencies]
kernel-core = { path = "../../kernel-core", default-features = false }
syscall-lib = { path = "../syscall-lib", features = ["alloc"] }
