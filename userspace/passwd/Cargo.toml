[package]
name = "passwd"
version.workspace = true
edition.workspace = true

[features]
default = ["guest-bin"]
guest-bin = []
host-tests = []

[lib]
name = "passwd"
path = "src/lib.rs"
test = false

[[bin]]
name = "passwd"
path = "src/main.rs"
required-features = ["guest-bin"]
test = false

[[test]]
name = "passwd_host"
path = "host-tests/passwd_host.rs"
required-features = ["host-tests"]

[dependencies]
# `alloc` for the argon2id password hash (Phase 110 Track C) — needs a heap
# matrix, so the passwd binary carries a `BrkAllocator`.
syscall-lib = { path = "../syscall-lib", features = ["argon2"] }
shadow = { path = "../lib/shadow" }
