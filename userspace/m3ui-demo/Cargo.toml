[package]
name = "m3ui-demo"
version.workspace = true
edition.workspace = true
description = "Phase 105 Track A.7 — m3ui toolkit demo Toplevel (drives toolkit-render-probe)."

[[bin]]
name = "m3ui-demo"
path = "src/main.rs"

[dependencies]
m3ui = { path = "../lib/m3ui", features = ["render"] }
desktop_client = { path = "../lib/desktop_client" }
kernel-core = { path = "../../kernel-core", default-features = false }
syscall-lib = { path = "../syscall-lib", features = ["alloc"] }
