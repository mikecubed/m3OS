[package]
name = "camera_server"
version.workspace = true
edition.workspace = true
description = "Phase 92c — ring-3 camera IPC server (UVC frame aggregator)."

[[bin]]
name = "camera_server"
path = "src/main.rs"

[dependencies]
driver_runtime = { path = "../lib/driver_runtime" }
syscall-lib = { path = "../syscall-lib", features = ["alloc"] }
kernel-core = { path = "../../kernel-core", default-features = false }
