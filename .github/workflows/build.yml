name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: x86_64-unknown-linux-musl
          components: rustfmt, clippy, rust-src

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf musl-tools qemu-utils e2fsprogs

      - name: Enable KVM (best-effort; falls back to TCG)
        # GitHub-hosted runners expose /dev/kvm (Phase 95 completion plan). Make
        # the kvm node usable by the runner user and set M3OS_KVM=1 only when it
        # is actually writable, so the QEMU smoke/device/regression steps below run
        # KVM-accelerated where available and gracefully fall back to TCG otherwise.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          [ -e /dev/kvm ] && sudo chmod 666 /dev/kvm || true
          if [ -w /dev/kvm ]; then
            echo "M3OS_KVM=1" >> "$GITHUB_ENV"
            echo "KVM available — gates run KVM-accelerated (M3OS_KVM=1)."
          else
            echo "KVM unavailable — gates run under TCG."
          fi

      - name: Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: TCC build cache
        uses: actions/cache@v5
        with:
          path: |
            target/tcc-src
            target/tcc-staging
          key: ${{ runner.os }}-tcc-${{ hashFiles('xtask/src/main.rs') }}
          restore-keys: ${{ runner.os }}-tcc-

      - name: "Gate bundle: cargo xtask check (clippy + fmt + host tests)"
        run: cargo xtask check

      - name: Allocator loom concurrency tests
        run: RUSTFLAGS='--cfg loom' cargo test -p kernel-core --target x86_64-unknown-linux-gnu --test allocator_loom

      - name: Fetch Nerd Font asset
        # Phase 69c: xtask/assets/fonts/term.ttf is gitignored — only the
        # SHA-256 checksum is committed. `cargo xtask smoke-test` triggers
        # `cargo xtask image`, which refuses to build the data disk without
        # the font asset. Fetch + SHA-verify it here so smoke-test (and the
        # device-smoke + regression steps below) see a valid asset. Mirrors
        # the equivalent step in release.yml.
        run: cargo xtask fetch-fonts

      - name: "Smoke test (headless workflow: boot + login + auth + service + storage + log + TCC)"
        run: |
          # Delete cached disk.img so it is regenerated with TCC files.
          rm -f target/x86_64-unknown-none/release/disk.img
          cargo xtask smoke-test --timeout 400

      - name: "Device-smoke parity lane (NVMe ± IOMMU + e1000 IOMMU)"
        # Timeouts stay widened off the old 90s lanes to cover the TCG-fallback
        # case (the job enables KVM best-effort above; GitHub runners expose
        # /dev/kvm, but the timeouts must still hold if a runner ever lacks it).
        # The NVMe lanes are reliable now that the ring-3 NVMe driver enables
        # MSI-X before creating its I/O completion queue.
        run: |
          cargo xtask device-smoke --device nvme --iommu --timeout 180
          cargo xtask device-smoke --device nvme --timeout 180
          cargo xtask device-smoke --device e1000 --iommu --timeout 180

      - name: "IPv6 dual-stack (ipv6-smoke: NDP/loopback/AF_INET6/TCP-over-IPv6 + recvmsg)"
        # Phase 91: always-on dual-stack IPv6 gate. SLIRP ipv6=on + the ::1
        # internal loopback exercise link-local/NDP/AF_INET6/TCP-over-IPv6/recvmsg
        # with no real router/internet; SLAAC/DHCPv6 live arms stay opt-in behind
        # M3OS_IPV6_LIVE (libslirp sends no RA).
        run: cargo xtask ipv6-smoke --timeout 300

      - name: Regression suite (SMP races + headless operator workflows)
        # Flake-isolation retry mirrors .githooks/pre-push and pr.yml: re-run any
        # failing test on a fresh QEMU and only fail on persistent failures, so
        # documented harness contention under TCG does not red the main branch.
        run: |
          set +e
          cargo xtask regression --timeout 180 2>&1 | tee regression.log
          suite_status=${PIPESTATUS[0]}
          set -e
          if [ "$suite_status" -ne 0 ]; then
            failed_tests="$(grep -E '^  [a-z0-9_-]+: FAIL' regression.log \
                            | sed -E 's/^  ([a-z0-9_-]+): FAIL.*/\1/')"
            if [ -z "$failed_tests" ]; then
              echo "::error::regression suite failed but no per-test FAIL lines parsed"
              exit 1
            fi
            echo "Suite-level failures detected — re-running flakes in isolation:"
            for t in $failed_tests; do echo "  - $t"; done
            real_failures=""
            for t in $failed_tests; do
              echo "Isolated re-run: $t"
              if ! cargo xtask regression --test "$t" --timeout 180; then
                real_failures="$real_failures $t"
              fi
            done
            if [ -n "$real_failures" ]; then
              echo "::error::regression failures persisted in isolation:$real_failures"
              exit 1
            fi
            echo "All suite failures passed in isolation — treating as harness flakiness."
          fi

      - name: Upload regression artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: regression-artifacts
          path: target/regression/
          retention-days: 14
