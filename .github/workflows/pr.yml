name: PR Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: x86_64-unknown-linux-musl
          components: rustfmt, clippy, rust-src

      - name: Install system dependencies
        # musl-tools + qemu-utils + e2fsprogs are needed by `cargo xtask check`
        # (cross-compile + disk-image build paths). QEMU itself is exercised by
        # the separate `qemu-gates` job below.
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools qemu-utils e2fsprogs

      - name: Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: TCC build cache
        uses: actions/cache@v5
        with:
          path: |
            target/tcc-src
            target/tcc-staging
          key: ${{ runner.os }}-tcc-${{ hashFiles('xtask/src/main.rs') }}
          restore-keys: ${{ runner.os }}-tcc-

      - name: "Gate bundle: cargo xtask check (clippy + fmt + host tests)"
        run: cargo xtask check

      - name: Allocator loom concurrency tests
        run: RUSTFLAGS='--cfg loom' cargo test -p kernel-core --target x86_64-unknown-linux-gnu --test allocator_loom

  # Headless QEMU gates on the PR. Runs in parallel with `check`. Timeouts are
  # deliberately generous (vs. build.yml's tighter post-merge lanes) because
  # GitHub runners have no KVM — QEMU executes under TCG, which is markedly
  # slower than developer hardware. The device-smoke NVMe lane was unreliable
  # under TCG until the ring-3 NVMe driver was fixed to enable MSI-X *before*
  # creating its I/O completion queue (PR re-enabling this gate); it is now
  # verified 10/10 under TCG, so both NVMe (± IOMMU) lanes are gated here.
  qemu-gates:
    name: QEMU smoke + device + regression gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: x86_64-unknown-linux-musl
          components: rustfmt, clippy, rust-src

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf musl-tools qemu-utils e2fsprogs

      - name: Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: TCC build cache
        uses: actions/cache@v5
        with:
          path: |
            target/tcc-src
            target/tcc-staging
          key: ${{ runner.os }}-tcc-${{ hashFiles('xtask/src/main.rs') }}
          restore-keys: ${{ runner.os }}-tcc-

      - name: Fetch Nerd Font asset
        # xtask/assets/fonts/term.ttf is gitignored — only the SHA-256 checksum
        # is committed. `cargo xtask smoke-test` → `cargo xtask image` refuses to
        # build the data disk without the font asset. Mirrors build.yml.
        run: cargo xtask fetch-fonts

      - name: "Smoke test (boot + login + auth + service + storage + log)"
        run: |
          # Regenerate the data disk so a stale cached image cannot mask a
          # build/boot regression (mirrors build.yml's smoke-test recipe).
          rm -f target/x86_64-unknown-none/release/disk.img
          cargo xtask smoke-test --timeout 400

      - name: "Device-smoke (NVMe ± IOMMU + e1000 IOMMU)"
        run: |
          cargo xtask device-smoke --device nvme --iommu --timeout 180
          cargo xtask device-smoke --device nvme --timeout 180
          cargo xtask device-smoke --device e1000 --iommu --timeout 180

      - name: "AHCI ring-3 write path (root over ahci.block, 200 KiB write+read-back)"
        # Phase 87: the ONLY CI coverage of a payload WRITE through the ring-3
        # block path (blk::remote::write_sectors -> do_write_ipc -> ahci_driver
        # handle_write). Boots with the ext2 root routed to ich9-ahci, logs in,
        # and runs ext2-coherence-smoke (200 KiB write + fresh-process byte
        # read-back) ON the AHCI root. The default smoke-test/regression suites
        # only exercise in-kernel virtio-blk; the AHCI/NVMe gates elsewhere only
        # read or run a driver-internal self-test, so a data[1]/recv-buffer
        # regression in the ring-3 write path would otherwise ship untested.
        # musl-tools is installed above, so the C self-test is built. REQUIRE_PASS
        # makes a SKIP (e.g. if musl-tools is ever dropped from the apt list above)
        # a hard CI failure rather than a silent green — this gate is the only CI
        # coverage of the ring-3 write path, so a vacuous pass must not be possible.
        run: M3OS_AHCI_RW_REQUIRE_PASS=1 cargo xtask ahci-rw-smoke --timeout 300

      - name: "AHCI reboot persistence (write → reboot → re-read off the same ahci.block disk)"
        # Phase 87: proves a write to the ring-3 AHCI root SURVIVES a reboot, not
        # just a within-boot read-back. Two boots against the same ext2 disk:
        # boot 1 writes a marker + idles past one periodic write-back flush (so
        # deferred ext2 metadata drains + BLK_FLUSH is issued), then boot 2 mounts
        # ext2 fresh and re-reads it. Also asserts boot 1 logged no
        # "[blk] remote block flush failed". Validates on-disk/remount consistency
        # + the BLK_FLUSH IPC path. echo/cat only — no musl dependency.
        run: cargo xtask ahci-persist-smoke --timeout 300

      - name: "IPv6 dual-stack (ipv6-smoke: NDP/loopback/AF_INET6/TCP-over-IPv6 + recvmsg)"
        # Phase 91: the always-on dual-stack IPv6 gate. Boots with SLIRP
        # ipv6=on (which cmd_ipv6_smoke sets itself) and asserts the
        # CI-deterministic arms — link-local formation, a live NDP NS->NA over
        # the wire, AF_INET6 socket/bind6, the ping6 ::1 ICMPv6 loopback, full
        # dual-stack TCP over IPv6 (incl. family-aware accept/getpeername re-arm),
        # and recvmsg sockaddr_in6 — all over the ::1 internal loopback, no real
        # router/internet. The SLAAC/DHCPv6 live-router arms stay opt-in behind
        # M3OS_IPV6_LIVE (libslirp sends no RA). Mirrors the M3OS_IPV6_REGRESSION
        # pre-push gate.
        run: cargo xtask ipv6-smoke --timeout 300

      - name: "Regression suite (with flake-isolation retry)"
        # `cargo xtask regression` is not test-isolated; suite-level QEMU
        # contention occasionally yields spurious per-test timeouts under TCG.
        # Re-run any failing test on a fresh QEMU and only treat persistent
        # failures as real — mirrors the .githooks/pre-push regression block so
        # the PR gate keeps its authority over genuine regressions while staying
        # stable against the documented harness flakiness.
        run: |
          set +e
          cargo xtask regression --timeout 180 2>&1 | tee regression.log
          suite_status=${PIPESTATUS[0]}
          set -e
          if [ "$suite_status" -ne 0 ]; then
            failed_tests="$(grep -E '^  [a-z0-9_-]+: FAIL' regression.log \
                            | sed -E 's/^  ([a-z0-9_-]+): FAIL.*/\1/')"
            if [ -z "$failed_tests" ]; then
              echo "::error::regression suite failed but no per-test FAIL lines parsed"
              exit 1
            fi
            echo "Suite-level failures detected — re-running flakes in isolation:"
            for t in $failed_tests; do echo "  - $t"; done
            real_failures=""
            for t in $failed_tests; do
              echo "Isolated re-run: $t"
              if ! cargo xtask regression --test "$t" --timeout 180; then
                real_failures="$real_failures $t"
              fi
            done
            if [ -n "$real_failures" ]; then
              echo "::error::regression failures persisted in isolation:$real_failures"
              exit 1
            fi
            echo "All suite failures passed in isolation — treating as harness flakiness."
          fi

      - name: Upload regression artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: pr-regression-artifacts
          path: target/regression/
          retention-days: 14
