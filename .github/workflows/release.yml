name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.3.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: x86_64-unknown-linux-musl
          components: rustfmt, clippy, rust-src

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf musl-tools qemu-utils

      - name: Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Lint (clippy + fmt)
        run: cargo xtask check

      - name: Clean cached disk image
        # The Cargo cache may restore a target/x86_64-unknown-none/release/disk.img
        # from a previous release run that predates Phase 69c's Nerd Font
        # sidecar marker. `cargo xtask image` refuses to reuse such a disk
        # and aborts with "no sidecar marker at .../disk.img.font.sha256".
        # `cargo xtask clean` removes disk.img and the marker so the image
        # step always rebuilds the data disk against the current font asset.
        run: cargo xtask clean

      - name: Fetch Nerd Font asset
        # Phase 69c: xtask/assets/fonts/term.ttf is gitignored — only the
        # SHA-256 checksum is committed. `cargo xtask image` requires the
        # asset to be present for the `/usr/share/fonts/m3os/term.ttf`
        # ext2 placement and aborts otherwise. Fetch + verify before image
        # build.
        run: cargo xtask fetch-fonts

      - name: Build disk images
        run: cargo xtask image

      - name: Boot smoke test
        run: |
          # 180s budget: leaves ample headroom for CI kernel rebuild (~20s),
          # disk image assembly, and QEMU boot through to userspace. A 30s
          # budget consistently SIGTERMs QEMU mid-kernel-init.
          #
          # `--fresh` is required: the prior `Build disk images` step runs
          # `cargo xtask image`, which (since Phase 71) stages the
          # `/etc/m3os-graphical-only` marker in the disk. Without
          # `--fresh`, `cargo xtask run` would short-circuit, reuse that
          # disk, and init would wait for the GUI greeter — no serial
          # login prompt ever appears and the smoke test below times out.
          # `--fresh` rebuilds disk.img with `graphical_login=false`
          # (serial autologin) for the headless boot check. The released
          # UEFI image is unaffected; only the local disk.img is rebuilt.
          timeout 180 cargo xtask run --fresh 2>&1 | tee boot.log || true
          # Phase 27: verify userspace init banner and login prompt
          grep -q 'm3OS init (PID 1)' boot.log
          grep -qE '(login:|ion# |\$ )' boot.log
          ! grep -q 'panicked at' boot.log

      - name: Prepare release artifacts
        run: |
          mkdir -p release
          cp target/x86_64-unknown-none/release/boot-uefi-m3os.img release/
          cp target/x86_64-unknown-none/release/boot-uefi-m3os.vhdx release/ 2>/dev/null || true
          cp target/x86_64-unknown-none/release/kernel release/kernel.elf

      - name: Resolve tag name
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          make_latest: true
          files: |
            release/boot-uefi-m3os.img
            release/boot-uefi-m3os.vhdx
            release/kernel.elf
