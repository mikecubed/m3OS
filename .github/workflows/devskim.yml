# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: DevSkim

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '28 22 * * 3'

jobs:
  lint:
    name: DevSkim
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run DevSkim scanner
        uses: microsoft/DevSkim-Action@v1
        with:
          directory-to-scan: .
          should-scan-archives: false
          # Keep our m3OS-specific platform code (m3os_sound.c,
          # m3os_music.c, m3os_dmx.c, dg_m3os.c) under scan — dmx in
          # particular parses untrusted WAD lump bytes and should be
          # exercised by DevSkim. Only exclude the vendored doomgeneric
          # tree, the upstream-derived patches/ overlay, and the host
          # ASSERT-macro test files (where the only DS154189 hits are
          # literal-string fprintf calls in test plumbing).
          ignore-globs: "sunset-local/docs/**,sunset-local/testing/**,userspace/doom/doomgeneric/**,userspace/doom/patches/**,userspace/doom/tests/**"

      - name: Upload DevSkim scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: devskim-results.sarif
