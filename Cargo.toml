# Exclude xtask and userspace from default build — kernel only
default-members = ["kernel"]

resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
panic = "abort"

# Phase 111 Track A.1 — DWARF-bearing kernel build for `cargo xtask debug`.
# Inherits release but disables LTO (which inlines away most small functions,
# so `break <rust_fn>` and named backtraces stop resolving) and emits full
# debug info. The DWARF sits in non-PT_LOAD sections, so the booted image's
# loaded footprint is identical to release — only the host-side ELF grows,
# and GDB reads its symbols from that ELF. The default/production build
# (`--release`) is untouched. Artifacts land in `target/<triple>/kdebug/`.
[profile.kdebug]
inherits = "release"
lto = false
debug = "full"

# Phase 42: RustCrypto workspace dependencies
[workspace.package]
version = "0.99.0"
edition = "2024"

[workspace.dependencies]
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
hkdf = { version = "0.12", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false }
aes = { version = "0.8", default-features = false }
ctr = { version = "0.9", default-features = false }
ed25519-dalek = { version = "2", default-features = false, features = ["rand_core"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
rand_chacha = { version = "0.3", default-features = false }
rand_core = { version = "0.6", default-features = false }
sunset = { path = "sunset-local", default-features = false }
getrandom = { version = "0.2", default-features = false, features = ["custom"] }
