[package]
name = "kernel"
version = "0.86.1"
edition = "2024"

# Phase 61 Track 0a — kernel is built as both a library (so `kernel/tests/*.rs`
# integration tests can `use kernel::...` to reach scheduler / SMP / pipe
# internals) and a standalone `no_std` `no_main` binary. Neither target makes
# sense as a `cargo test` target on its own:
#   - The library has no `#[panic_handler]` (the binary owns it).
#   - The binary's `cfg(test)` test-runner path references `kernel::testing`,
#     which is only present when the library is itself compiled with
#     `cfg(test)` — a configuration that does not match how integration tests
#     link against the lib.
# Disable both `cargo test` targets; QEMU integration tests under
# `kernel/tests/*.rs` are the supported test path (`cargo xtask test`).
[lib]
test = false
doctest = false

[[bin]]
name = "kernel"
path = "src/main.rs"
test = false

[dependencies]
bootloader_api = "0.11.15"
uart_16550 = "0.4.0"
log = "0.4.29"
spin = "0.9.8"
x86_64 = "0.15.4"
pic8259 = "0.11.0"
kernel-core = { path = "../kernel-core", default-features = false }

[features]
default = ["trace", "preempt-voluntary"]
# I.2 soak (procedural gate): 24-hour post-flip soak required before removing the
# cfg(feature = "preempt-voluntary") guards (I.3). Do not remove guards until I.2 passes.
trace = []
# Phase 77 follow-up — the "Net-RX hang" / "blk-drain" stage probes (Wakeup kinds
# 4-8) wired into the device-IRQ dispatch, virtio-net RX ISR/poll, TCP recv, and
# virtio-blk completion paths. These were investigation-specific instrumentation
# for the SSH-disconnect / net-RX hang study; default OFF so 1.0 builds carry no
# per-IRQ/net/blk trace residue. Enable to re-run that investigation:
#   M3OS_KERNEL_FEATURES=net-rx-trace cargo xtask run
net-rx-trace = ["trace"]
legacy-bootstrap-allocator = []
# Phase 77 Track B: debug-only SMEP/SMAP "deliberate fault" self-test.
# Adds a boot-time self-test plus a feature-gated expected-fault recovery hook
# in the page-fault handler. Zero-cost/absent in production. Run with:
#   cargo xtask run --features smep-smap-test  (or via M3OS_KERNEL_FEATURES)
smep-smap-test = []
# When `sched-trace` is enabled, every block/wake/scan state transition
# emits a structured SchedTrace entry into the per-core trace ring (Phase 43b).
# Default OFF — zero runtime overhead in production builds.
# Enable with: cargo xtask check --features sched-trace
# (or pass --features kernel/sched-trace to direct cargo invocations)
sched-trace = []
# Phase 57d E.2: voluntary-preemption zero-crossing logic.
# When enabled, `preempt_enable` records a deferred reschedule at the
# zero-crossing point; consumed at the user-mode-return boundary (E.3).
# Now in `default` as of Track I (v0.57.4).
# TODO(I.3): remove this feature flag and unwrap all cfg(feature = "preempt-voluntary")
# gates once the 24-hour post-flip soak (I.2) passes. Until then, the gates remain as
# rollback safety. See docs/roadmap/tasks/57d-voluntary-preemption-tasks.md § I.3.
preempt-voluntary = []
# Phase 57e — Full Kernel Preemption (PREEMPT_FULL): RETIRED.
# Phase 57e is deferred (2026-05-07) — see
# `docs/post-mortems/2026-05-07-57e-preempt-full-deferred.md`.  The
# `preempt-full` feature flag and every cfg(feature = "preempt-full")
# site in the kernel were removed in the deferral cleanup.  The
# preempt-voluntary discipline below is now the only preemption model.
# When `hardened` is enabled, the `sys_block_read` whitelist is restricted to
# production storage servers only (vfs_server, fat_server). Without this flag,
# test binaries such as `nvme-crash-smoke` are also permitted, which allows
# EAGAIN observation from the kernel facade path during integration testing.
# Enable this feature for production / secure-boot images.
hardened = []
# Phase 57d follow-up — diagnostic instrumentation around the
# fork → dispatch → execve pipeline plus the syscall-return preemption
# boundary. Retained behind a feature flag so default builds pay zero
# cost while the same toolchain remains available for diagnosing
# regressions without a kernel rebuild from scratch.
#
# Emits (all `[exec-trace] ...` lines, all `log::info!`-level):
#
# * `fork-task-spawn pid=N task_idx=I target_core=C`
#   — scheduler enqueued a fresh fork child onto its target core.
# * `fork-child pid=N trampiline-enter task_idx=Some(I)`
#   — fork child reached `fork_child_trampoline` (regression guard for
#     the "spawned but never dispatched" stall fixed by the syscall-return
#     preemption + virtio-blk single-flight slot rework).
# * `fork-child pid=N entering ring 3 rip=... rsp=...`
#   — fork child is about to `iretq` / `sysretq` to user mode for the
#     first time.
# * `syscall-return-preempt core=C pid=N rip=... reschedule=B pending=B`
#   — syscall-return path is about to call `preempt_frame_to_scheduler`
#     because either the per-core `reschedule` flag or the deferred
#     `preempt_resched_pending` flag was set. Budgeted via
#     `SYSCALL_RETURN_PREEMPT_TRACE_BUDGET` so a busy build doesn't drown
#     the boot transcript.
# * `pid=N dup2 oldfd=A newfd=B` and `pid=N dup2 -> EBADF (out of range)`
#   — every dup2 call (success or failure).
# * `pid=N execve(path_ptr=..., argv_ptr=..., envp_ptr=...)`,
#   `pid=N execve path="..."`,
#   `pid=N execve OK path="..." entry=... rsp=...`,
#   plus the matching error legs (`-> EFAULT`, `-> EACCES`,
#   `read_file_from_disk failed`, `resolve_path_from_dirfd failed`,
#   `resolve_existing_fs_path failed`).
#   — every execve attempt and outcome.
# * `pid=N close fd=F` (skipped for pid=1 to drop init's reap-loop spam).
#
# Default OFF because it is noisy under load. Enable with
#   M3OS_KERNEL_FEATURES=exec-trace cargo xtask run-gui --fresh
# or, for direct cargo invocations,
#   cargo build -p kernel --features kernel/exec-trace
exec-trace = []
